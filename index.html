<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essay Search Engine</title>
  <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css">
</head>
<body>
  <main class="container" style="--container-max:56rem">
    <form id="searchForm" role="search">
      <div id="tagBadges" class="hstack" role="list"></div>
      <fieldset class="group">
        <input
          type="search"
          id="searchInput"
          name="q"
          placeholder="Search or add tags..."
          list="tagOptions"
          autocomplete="off"
          aria-label="Search input"
          disabled
        />
        <datalist id="tagOptions"></datalist>
        <button type="submit" id="searchButton" disabled>Search</button>
      </fieldset>
    </form>

    <p id="status" class="text-light" role="status" aria-live="polite"></p>
    <section id="results" aria-label="Results"></section>
    <nav id="pagination" aria-label="Pagination"></nav>

    <footer class="mt-6">
      <small><a href="./tags.html">Browse all tags →</a></small>
    </footer>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
